<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turpial - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-circle">
            <img src="img/turpial.png" alt="El Turpial Logo">
        </div>
        
        <h2 class="title">Inicia tu Sesión</h2>

        <form id="loginForm">
            <input type="email" id="correo" placeholder="Ingresa tu correo" required>
            <input type="password" id="contraseña" placeholder="Ingresa tu contraseña" required>
            
            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>

        <a href="#" class="link-recuperar">Recuperar contraseña</a>
    </div>
</body>
</html>
