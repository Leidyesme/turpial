<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
</head>
<body>
    <div class="container">
        <div class="products">
            <!-- HEADER -->
            <div class="products__header">
                <h1 class="products__title">Gestión de Productos</h1>
                <button class="btn btn--verde" id="addProductBtn">Agregar Producto</button>
            </div>
            <!-- SEARCH -->
            <div class="products__search">
                <input type="text" class="products__input input" id="searchInput" placeholder="Buscar producto">
            </div>
            <!-- PRODUCTS -->
            <div class="products__container" id="productsContainer">

            </div>
        </div>
    </div>

    <!-- Modal para Agregar Producto -->
    <div id="productModal" class="modal" style="display: none;">
        <div class="modal-content section">
            <h2 id="modalTitle" style="color: var(--text-color); margin-bottom: 10px;">Agregar Producto</h2>
            <form id="productForm" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                <input type="text" id="prodName" class="input" placeholder="Nombre de Producto" required>
                <input type="number" id="prodPrice" class="input" placeholder="Precio" min="1" required>
                <input type="number" id="prodStock" class="input" placeholder="Stock" min="0" required>
                <select id="prodCategory" class="input" required>
                    <option value="">Seleccione Categoría</option>
                </select>
                <label style="font-size: 13px; font-weight: bold; margin-top: 5px; text-align: left;">Imagen del Producto:</label>
                <input type="file" id="prodImageFile" class="input" accept="image/*" style="padding: 5px;">
                <input type="hidden" id="prodImage">
                <div id="prodImagePreview" style="margin: 5px 0; text-align: center;">
                    <img id="prodImageTag" src="" alt="Vista previa" style="max-height: 80px; max-width: 100%; border-radius: 8px; display: none; margin: 0 auto;">
                </div>
                <div class="modal-actions" style="display: flex; justify-content: space-between; margin-top: 10px; width: 100%;">
                    <button type="button" id="cancelProdBtn" class="btn btn--rojo" style="padding: 10px 20px;">Cancelar</button>
                    <button type="submit" class="btn btn--verde" style="padding: 10px 20px;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Editar Producto -->
    <div id="editProductModal" class="modal" style="display: none;">
        <div class="modal-content section" style="width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box;">
            <h2 style="color: var(--text-color); margin-bottom: 15px; text-align: center;">Editar Producto</h2>
            <form id="editProductForm" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                <input type="hidden" id="editProdId">
                <input type="text" id="editProdName" class="input" placeholder="Nombre de Producto" required>
                <input type="number" id="editProdPrice" class="input" placeholder="Precio" min="1" required>
                <input type="number" id="editProdStock" class="input" placeholder="Stock" min="0" required>
                <select id="editProdCategory" class="input" required>
                    <option value="">Seleccione Categoría</option>
                </select>
                <label style="font-size: 13px; font-weight: bold; margin-top: 5px; text-align: left;">Imagen del Producto:</label>
                <input type="file" id="editProdImageFile" class="input" accept="image/*" style="padding: 5px;">
                <input type="hidden" id="editProdImage">
                <div id="editProdImagePreview" style="margin: 5px 0; text-align: center;">
                    <img id="editProdImageTag" src="" alt="Vista previa" style="max-height: 80px; max-width: 100%; border-radius: 8px; display: none; margin: 0 auto;">
                </div>
                <div class="modal-actions" style="display: flex; justify-content: space-between; margin-top: 15px; width: 100%; gap: 10px;">
                    <button type="button" id="cancelEditProdBtn" class="btn btn--rojo" style="padding: 10px 20px; flex: 1;">Cancelar</button>
                    <button type="submit" class="btn btn--verde" style="padding: 10px 20px; flex: 1;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../../js/auth/authGuard.js"></script>
    <script type="module" src="./productsController.js"></script>
</body>
</html>
