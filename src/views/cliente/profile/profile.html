<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
    <script src="https://kit.fontawesome.com/3adbf84a23.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="profile">
            <h1 class="profile__title">Mi Perfil</h1>
            <div class="profile__info">
                <img src="../../../../public/Conny.jpg" class="profile__img img" alt="Foto de perfil">
                <h2 class="profile__name" id="profileName"></h2>
                <p class="profile__email" id="profileEmail"></p>
                <p class="profile__phone" id="profilePhone"></p>
                <p class="profile__Estado" id="profileEstado"></p>
            </div>
            <div class="profile__actions">
                <!-- Panel específico para Clientes (ROL-003) -->
                <div id="clientePanel" style="display: none;">
                    <h2>Mi Perfil</h2>
                    <div id="historialCliente"></div>
                    <a href="../returns/returns.html" class="profile__link" id="solicitarDevolucionLink"><button class="btn btn--rojo">Solicitar devolución</button></a>
                </div>
                
                <!-- Panel específico para Administradores (ROL-001) -->
                <div id="adminPanel" style="display: none; width: 100%;">
                    <a href="../../manager/returns/returns.html" class="profile__link" id="adminReturnsLink" style="width: 100%; display: block;"><button class="btn btn--rojo" style="width: 100%;">Gestionar Devoluciones</button></a>
                </div>

                <!-- Enlaces controlados dinámicamente por JS según el rol del usuario -->
                <a href="../orderHistory/orderHistory.html" class="profile__link" id="orderHistoryLink"><button class="btn btn--verde" id="orderHistoryBtn">Historial de Pedidos</button></a>
                <a href="../auditoria/auditoria.html" class="profile__link" id="activityHistoryLink"><button class="btn btn--beige">Historial de Actividades</button></a>
                <a href="../changePassword/change.html" class="profile__link" id="changePasswordLink"><button class="btn btn--marron">Cambiar contraseña</button></a>
                <a href="../editProfile/editProfile.html" class="profile__link" id="editProfileLink"><button class="btn btn--verde">Editar Perfil</button></a>
                <button class="btn btn--rojo" id="logoutBtn">Cerrar Sesión</button>
            </div>
            <div class="botones--links">
                <a href="../categories/categories.html" class="profile__link link"><i class="fa-solid fa-house"></i></a>
                <a href="../fastCar/fastCar.html" class="profile__link link"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="../profile/profile.html" class="profile__link link"><button class="profile__usuario usuario">L</button></a>
            </div>
        </div>
    </div>
    <script src="../../../js/history/history.js"></script>
    <script src="../../../js/auth/authGuard.js"></script>
    <script type="module" src="./profileController.js"></script>
</body>
</html>
