<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
    <script src="https://kit.fontawesome.com/3adbf84a23.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="fastcar">
            <h1 class="fastcar__title">Mi carrito</h1>
            <div class="fastcar__options section" id="cartContainer">
                <!-- Productos del carrito -->
            </div>
            
            <!-- TIPO DE PEDIDO -->
            <div class="fastcar__delivery-section section">
                <h3 class="fastcar__delivery-title">Tipo de Pedido</h3>
                <select id="tipoPedido" class="input" >
                    <option value="A domicilio">A domicilio</option>
                    <option value="Para recoger">Para recoger</option>
                    <option value="Para consumir aquí">Para consumir aquí</option>
                </select>
                
                <!-- Input de Mesa (solo si es Consumir aquí) -->
                <div id="mesaContainer" style="display: none; margin-top: 10px; width: 100%;">
                    <label style="color: var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">Número de Mesa:</label>
                    <input type="number" id="numeroMesaInput" class="input" placeholder="Ej: 5" min="1" style="width: 100%;">
                </div>
                
            <!-- DIRECCION DE ENTREGA (Condicional para Domicilio) -->
            <div class="fastcar__address-section section" id="deliveryAddressContainer">
                <h3 class="fastcar__address-title">Dirección de Entrega</h3> -->
                
                <!-- Tarjeta de dirección registrada -->
                <div class="address-card" id="savedAddressCard">
                    <label class="address-card__label">
                        <input type="radio" name="addressOption" id="useSavedAddress" checked>
                        <span class="address-card__details">
                            <strong>Dirección Registrada:</strong>
                            <span id="savedAddressText">Cargando dirección...</span>
                        </span>
                    </label>
                </div>
                
                <!-- Opción de nueva dirección -->
                <div class="address-card">
                    <label class="address-card__label">
                        <input type="radio" name="addressOption" id="useNewAddress">
                        <span class="address-card__details">
                            <strong>Otra Dirección:</strong>
                        </span>
                    </label>
                    <input type="text" class="input address-card__input" id="newAddressInput" placeholder="Escribe la nueva dirección..." disabled>
                </div>
            </div>

            <!-- MÉTODO DE PAGO -->
            <div class="fastcar__payment-section section">
                <h3 class="fastcar__payment-title">Método de Pago</h3>
                <select id="metodoPago" class="input" style="width: 100%;">
                    <option value="Efectivo">Efectivo</option>
                </select>
                
                <!-- Sección efectivo (cambio/vuelto) -->
                <div id="efectivoContainer" style="display: none; margin-top: 10px; width: 100%;">
                    <label style="color: var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">¿Con cuánto vas a pagar?</label>
                    <input type="number" id="montoRecibidoInput" class="input" placeholder="Monto recibido ($)" min="0" style="width: 100%;">
                    <p id="vueltoContainer" style="margin-top: 10px; font-weight: bold; color: var(--green); font-size: 1.1em; display: none;">
                        Vuelto: <span id="vueltoValor">$0</span>
                    </p>
                </div>
            </div>

            <h2 class="fastcar__total" id="cartTotal">Total: $33.000</h2>
                <button class="btn btn--verde" id="checkoutButton">Realizar pedido</button>
            <div class="botones--links">
                <a href="../categories/categories.html" class="profile__link link"><i class="fa-solid fa-house"></i></a>
                <a href="../fastCar/fastCar.html" class="profile__link link" id="checkoutBotton"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="../profile/profile.html" class="profile__link link"><button class="profile__usuario usuario">L</button></a>

            </div>
        </div>
    </div>
    <script src="../../../js/history/history.js"></script>
    <script src="../../../js/auth/authGuard.js"></script>
    <script type="module" src="./fastCarController.js"></script>
</body>
</html>
