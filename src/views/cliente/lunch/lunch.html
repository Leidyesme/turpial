<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
    <script src="https://kit.fontawesome.com/3adbf84a23.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="back">
            <button id="backButton" class="back__button">← Atrás</button>
        </div>
        <div class="lunch">
            <h1 class="lunch__title">Almuerzos</h1>
            <div class="lunch__container">
                <div class="lunch__item section">
                    <img src="../../../../public/lunch/lunch1.png" class="lunch__img imgforma" alt="Almuerzo 1">
                    <h2 class="lunch__name">Arroz con pollo</h2>
                    <p class="lunch__price">Precio: $6.000</p>
                    <div class="lunch__state">
                        <button class="btn btn--verde">Disponible</button>
                        <a href="#" class="link__item add-to-cart"
                            data-name="Arroz con pollo"
                            data-price="6000"
                            data-image="../../../../public/lunch/lunch1.png"
                            data-status="Disponible">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                </div>
                <div class="lunch__item section">
                    <img src="../../../../public/lunch/lunch2.png" class="lunch__img imgforma" alt="Almuerzo 2">
                    <h2 class="lunch__name">Ajiaco Santafereño</h2>
                    <p class="lunch__price">Precio: $8.000</p>
                    <div class="lunch__state">
                        <button class="btn btn--rojo">Agotado</button>
                        <a href="#" class="link__item add-to-cart"
                            data-name="Ajiaco Santafereño"
                            data-price="8000"
                            data-image="../../../../public/lunch/lunch2.png"
                            data-status="Agotado">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                </div>
                <div class="lunch__item section">
                    <img src="../../../../public/lunch/lunch3.png" class="lunch__img imgforma" alt="Almuerzo 3">
                    <h2 class="lunch__name">Sudado de pollo y papa</h2>
                    <p class="lunch__price">Precio: $8.000</p>
                    <div class="lunch__state">
                        <button class="btn btn--verde">Disponible</button>
                        <a href="#" class="link__item add-to-cart"
                            data-name="Sudado de pollo y papa"
                            data-price="8000"
                            data-image="../../../../public/lunch/lunch3.png"
                            data-status="Disponible">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../../js/auth/authGuard.js"></script>
    <script type="module" src="./lunchController.js"></script>
</body>
</html>
