<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
</head>
<body>
    <div class="container">
        <div class="code">
            <div class="code__logo">
                <img src="../../../../public/turpial.png" class="code__img img" alt="El Turpial Logo">
            </div>
            <h1 class="code__title">Recuperar contraseña</h1>
            <h2 class="code__subtitle">Ingresa tu código de recuperación</h2>
            <form id="codeForm">
                <input type="text" class="code__email input"
                placeholder="Ingresa el código" id="code" required>
                <button type="submit"
                class="btn btn--rojo">Ingresar</button>
            </form>
        </div>
    </div>
    <script src="./codepasswordcontroller.js"></script>
</body>
</html>
