<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../../style/main.css">
</head>
<body>
    <div class="container">
        <div class="login">
            <div class="login__logo">
                <img src="../../../../public/turpial.png" class="login__img" alt="El Turpial Logo">
            </div>
            
            <h2 class="login__titulo">Inicia tu Sesión</h2>

            <form id="login__Form">
                <input type="email" class="login__input" id="correo" placeholder="Ingresa tu correo" required>
                <input type="password" class="login__input" id="contraseña" placeholder="Ingresa tu contraseña" required>
                
                <button type="submit" class="login__boton">Ingresar</button>
            </form>
            <a href="#" class="login__crearcuenta">¿Ya tienes sesión?Crea tu cuenta</a>
            <a href="#" class="login__link">Recuperar contraseña</a>
        </div>
    </div>
</body>
</html>
